<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">Frontiers in Medicine journal cover</title>
  <desc id="desc">Frontiers in Medicine, a journal by Frontiers Media</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3fc3"/>
      <stop offset="1" stop-color="#2c83d2"/>
    </linearGradient>
    <clipPath id="imageCrop">
      <rect x="0" y="344" width="600" height="456"/>
    </clipPath>
  </defs>
  <rect width="600" height="800" fill="url(#paper)"/>
  <rect width="600" height="16" fill="url(#accent)"/>
  <g transform="translate(42 52)">
    <path d="M0 18 24 4l24 14-24 14z" fill="#27b7a4"/>
    <path d="M0 18v28l24 14V32z" fill="#0a75c9"/>
    <path d="m48 18v28L24 60V32z" fill="#e44f62"/>
    <path d="m24 4 24 14-24 14L0 18z" fill="#f3a72f" opacity=".95"/>
    <text x="72" y="35" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#313745">frontiers</text>
    <text x="74" y="72" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#313745">in Medicine</text>
  </g>
  <text x="44" y="176" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#687386">A JOURNAL BY FRONTIERS MEDIA</text>
  <line x1="44" y1="204" x2="556" y2="204" stroke="#d4dbe7" stroke-width="2"/>
  <text x="44" y="246" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#313745">Frontiers in Medicine</text>
  <text x="44" y="278" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#687386">Multidisciplinary medical research</text>
  <text x="44" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687386">ISSN 2296-858X · Open access</text>
  <g clip-path="url(#imageCrop)">
    <image href="frontiers-in-medicine.webp" x="0" y="344" width="600" height="456" preserveAspectRatio="xMidYMid slice" opacity=".96"/>
    <rect x="0" y="344" width="600" height="456" fill="url(#accent)" opacity=".12"/>
  </g>
  <rect x="0" y="744" width="600" height="56" fill="#202a3b" opacity=".92"/>
  <text x="44" y="778" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff">Evidence · Innovation · Patient care</text>
</svg>
